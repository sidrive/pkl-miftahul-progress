<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pervobaan T5 minggu 4</title>

<body>
    <h1>Input barang kasir</h1>

    <input type="text" id="input-cari-barang" placeholder="Cari barang" required>
    <br><br>

    <form id="form-belanja">
        <input type="text" id="input-nama-barang" placeholder="Nama barang" required>
        <input type="number" id="input-harga-barang" placeholder="Harga (Rp)...." required min="1" />
        <button type="submit">Tambah</button>
    </form>

    <ul id="daftar-belanja"></ul>

    <div>
        <h3>total: Rp<span id="total-harga">0</span></h3>
    </div>

    <script src="index.js"></script>
