<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <style>
        .selesai {
            text-decoration: line-through;
            color: #888;
            cursor: pointer;
        }
        li {
            cursor: pointer;
            user-select: none;
            margin-bottom: 4px;
        }
        #input-cari {
            margin-bottom: 10px;
            display: block;
        }
    </style>
</head>
<body>
    <h1>Project To-Do List</h1>
    <br>

    <input type="text" id="input-cari" placeholder="Cari task..." />

    <form id="form-todo">
        <input type="text" id="input-todo" placeholder="Ketik task baru..." required />
        <button type="submit">Tambah</button>
    </form>

    <ul id="daftar-todo"></ul>

    <script src="buggyIndex.js"></script>
</body>
</html>
