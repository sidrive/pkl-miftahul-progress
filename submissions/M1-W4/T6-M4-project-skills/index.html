<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PHOTO EXHIBITION</title>
    <style>
      /* Reset standar & font dasar */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        background-color: #f4f4f4;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background-color: #5eb86d;
        color: #fff;
        padding: 1rem;
        text-align: center;
      }
      nav a {
        color: #fff;
        text-decoration: none;
        margin: 0 1rem;
      }
      nav a:hover {
        text-decoration: underline;
        color: #ffcc00;
      }
      main section {
        padding: 3rem 2rem;
        text-align: center;
        background-color: #ffffff;
      }
      main h2 {
        margin-bottom: 0.5rem;
      }
      footer {
        background-color: #5eb86d;
        color: #fff;
        text-align: center;
        padding: 1rem;
        position: fixed;
        width: 100%;
        bottom: 0;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>GALLERY G</h1>
      <nav>
        <a href="#">Home</a> | <a href="#">Gallery</a> |
        <a href="#">Contact</a>
      </nav>
    </header>

    <main>
      <section>
        <h2>Welcome to the Photo Exhibition</h2>
        <p>
          Explore a curated collection of stunning photographs from talented
          artists around the world.
        </p>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 GALLERY G by Gazi. All rights reserved.</p>
    </footer>
  </body>
</html>
